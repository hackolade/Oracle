# Shared MIT Kerberos config for KDC, Oracle DB container, and client (Mac/Azure).
# Realm and hostnames are overridden at runtime via environment where applicable.

[libdefaults]
    default_realm = HACKOLADE.LOCAL
    dns_lookup_realm = false
    dns_lookup_kdc = false
    rdns = false
    ticket_lifetime = 24h
    renew_lifetime = 7d
    forwardable = true

[realms]
    HACKOLADE.LOCAL = {
        kdc = kdc.hackolade.local:88
        admin_server = kdc.hackolade.local:749
        default_domain = hackolade.local
    }

[domain_realm]
    .hackolade.local = HACKOLADE.LOCAL
    hackolade.local = HACKOLADE.LOCAL
